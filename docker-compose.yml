services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}
        REACT_APP_API_SCHEDULER_URL: ${REACT_APP_API_SCHEDULER_URL:-http://localhost:8080}
        REACT_APP_PRODUCTION_BRANCH_NAME: ${REACT_APP_PRODUCTION_BRANCH_NAME:-}
    image: papr-frontend
    container_name: papr-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
